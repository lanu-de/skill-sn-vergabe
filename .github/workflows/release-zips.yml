name: Skill-Pakete bei Release

# Baut bei jedem veröffentlichten GitHub-Release je Skill eine .skill- und eine .zip-Datei
# (Wurzel = Skill-Ordner mit SKILL.md, passend für den Upload auf claude.ai/ChatGPT) sowie
# das Sammel-Zip aller Skills sowie das Wissensbasis-Paket (für Assistenten ohne
# Skill-Unterstützung) und hängt sie als Download-Dateien an die Release-Seite an.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Release-Tag gegen Plugin-Version prüfen
        run: |
          tag="${{ github.event.release.tag_name }}"
          version=$(jq -r .version .claude-plugin/plugin.json)
          if [ "${tag#v}" != "$version" ]; then
            echo "::error::Release-Tag '$tag' passt nicht zur Version '$version' in .claude-plugin/plugin.json — bitte Version angleichen und Release neu anlegen."
            exit 1
          fi
          echo "Tag $tag passt zur Plugin-Version $version."

      - name: Referenzkopien aktuell?
        run: |
          python3 scripts/sync_shared.py sync
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::skills/*/references/ weicht von shared/references/ ab — Release-Stand ist nicht synchronisiert."
            exit 1
          fi

      - name: Skill-Pakete bauen
        run: |
          python3 scripts/build_packages.py --out dist
          ls -l dist

      - name: Pakete an das Release anhängen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.zip dist/*.skill --clobber
