name: "Technisches Problem"
description: "Ein Skill funktioniert nicht wie erwartet, Probleme bei Installation, Plugin, Skripten oder Release-Paketen."
title: "[Technik] "
labels: ["bug"]
body:
  - type: dropdown
    id: umgebung
    attributes:
      label: Umgebung
      description: Wo tritt das Problem auf?
      options:
        - claude.ai / Claude Desktop (Plugin oder .skill-Upload)
        - Claude Code (Plugin/Marketplace)
        - GitHub Copilot (VS Code, CLI)
        - Codex
        - Cursor
        - Gemini CLI
        - ChatGPT (Skills)
        - Microsoft 365 Copilot (Wissensbasis)
        - ChatGPT-Projekt / Custom GPT / Gemini Gem (Wissensbasis)
        - Installation mit npx skills
        - scripts/sync_shared.py oder scripts/build_packages.py
        - GitHub Actions / Release
        - Sonstiges
    validations:
      required: true
  - type: textarea
    id: beschreibung
    attributes:
      label: Was ist passiert?
      description: Beschreibung des Problems — was wurde gemacht, was war das Ergebnis?
    validations:
      required: true
  - type: textarea
    id: erwartet
    attributes:
      label: Erwartetes Verhalten
      description: Was hätte stattdessen passieren sollen?
    validations:
      required: false
  - type: textarea
    id: schritte
    attributes:
      label: Schritte zum Nachvollziehen
      description: Falls reproduzierbar — welche Schritte führen zu dem Problem? (Bei Skill-Antworten gern den verwendeten Prompt angeben.)
    validations:
      required: false
